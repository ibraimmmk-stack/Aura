<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura Home</title>
<style>
:root{--bg:#e9ecf3;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.8);--tx:#14161c;--tx2:#5b6070;--ac:#4f7cff;--r:26%;--w1:#bcd0ff;--w2:#f3c9e8;--w3:#c9f0e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d14;--glass:rgba(30,34,48,.55);--glass2:rgba(40,45,64,.85);--tx:#f2f4fa;--tx2:#a2a8bb;--w1:#1c2a5c;--w2:#4a1f4d;--w3:#0f4a45}}
:root[data-theme="dark"]{--bg:#0b0d14;--glass:rgba(30,34,48,.55);--glass2:rgba(40,45,64,.85);--tx:#f2f4fa;--tx2:#a2a8bb;--w1:#1c2a5c;--w2:#4a1f4d;--w3:#0f4a45}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.phone{position:relative;width:100%;height:100%;max-width:410px;max-height:880px;overflow:hidden;background:radial-gradient(120% 70% at 15% 10%,var(--w1),transparent 60%),radial-gradient(100% 60% at 90% 40%,var(--w2),transparent 60%),radial-gradient(120% 70% at 30% 100%,var(--w3),transparent 60%),var(--bg);user-select:none}
@media(min-width:500px){.phone{height:min(880px,96vh);border-radius:44px;box-shadow:0 0 0 9px #1b1d24,0 30px 80px rgba(0,0,0,.35)}}
.sb{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:13px;font-weight:600;z-index:5}
.sb i{font-style:normal;font-size:12px}
.pages{position:absolute;inset:38px 0 150px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;transition:transform .35s}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;padding:6px 18px;display:flex;flex-direction:column;gap:16px}
.clock{padding:6px 6px 0}
.clock b{display:block;font-size:76px;font-weight:300;letter-spacing:-3px;line-height:1}
.clock span{color:var(--tx2);font-size:15px}
.card{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:28px;padding:16px;border:1px solid rgba(255,255,255,.25)}
.stack{height:128px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.stack .dots{display:flex;gap:5px;align-self:flex-end}
.stack .dots u{width:6px;height:6px;border-radius:9px;background:var(--tx2);opacity:.35}
.stack .dots u.on{opacity:1;width:16px;background:var(--ac)}
.stack h3{font-size:34px;font-weight:300}.stack p{color:var(--tx2);font-size:14px}
.bar{height:8px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden}.bar div{height:100%;background:var(--ac);border-radius:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{height:96px;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;color:var(--tx2)}
.mini b{font-size:22px;color:var(--tx);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;cursor:pointer;position:relative}
.ic{width:58px;height:58px;border-radius:var(--r);display:grid;place-items:center;font-size:28px;box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .15s}
.app:active .ic{transform:scale(.88)}
.edit .app{animation:jig .25s infinite alternate}
@keyframes jig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@media(prefers-reduced-motion:reduce){.edit .app{animation:none}}
.ind{position:absolute;bottom:136px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.ind u{width:7px;height:7px;border-radius:9px;background:var(--tx2);opacity:.4;transition:.2s}.ind u.on{opacity:1;width:20px;background:var(--ac)}
.search{position:absolute;bottom:92px;left:30px;right:30px;height:44px;border-radius:30px;display:flex;align-items:center;padding:0 18px;color:var(--tx2);font-size:14px;cursor:pointer;background:var(--glass2)}
.dock{position:absolute;bottom:14px;left:14px;right:14px;height:70px;border-radius:34px;display:flex;justify-content:space-around;align-items:center;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.dock .ic{width:52px;height:52px;font-size:25px}
.sheet{position:absolute;inset:0;background:var(--glass2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:8;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding:50px 20px 20px;display:flex;flex-direction:column;gap:14px}
.sheet.open{transform:none}
.sheet input{width:100%;height:46px;border-radius:26px;border:0;padding:0 20px;font-size:15px;background:var(--glass);color:var(--tx);outline:2px solid transparent}
.sheet input:focus-visible{outline-color:var(--ac)}
.drawer{overflow:auto;flex:1;scrollbar-width:none}
.shade{position:absolute;inset:0;z-index:9;background:var(--glass2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);transform:translateY(-100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding:48px 18px 18px;display:flex;flex-direction:column;gap:14px}
.shade.open{transform:none}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tg button{border:0;border-radius:22px;height:64px;font-size:22px;background:var(--glass);color:var(--tx);cursor:pointer}
.tg button.on{background:var(--ac);color:#fff}
.tg button:focus-visible,.pill:focus-visible,.dock button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--ac)}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--tx2)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--tx)}
.pill{border:0;border-radius:20px;padding:8px 14px;background:var(--glass);color:var(--tx);cursor:pointer;font-size:13px}
.handle{position:absolute;top:10px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:9px;background:var(--tx2);opacity:.4;z-index:10;cursor:pointer}
.ic img{width:100%;height:100%;border-radius:var(--r);object-fit:cover}
.pages,.dock,.search{touch-action:pan-x}
.sug{display:flex;justify-content:space-around}
body.native .sb{display:none}
body.native .phone{max-width:none;max-height:none}
body.native .pages{top:34px}
.toast{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:12;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="phone" id="ph">
  <div class="sb"><span id="sbt">9:41</span><i id="bat">100 %</i></div>
  <div class="handle" id="hd" title="Panneau rapide"></div>
  <div class="pages" id="pages">
    <section class="page">
      <div class="clock"><b id="clk">9:41</b><span id="dt"></span></div>
      <div class="card stack" id="stack"></div>
      <div class="row">
        <div class="card mini"><span>Pas aujourd’hui</span><b>6 482</b><div class="bar"><div style="width:65%"></div></div></div>
        <div class="card mini"><span>Prochain événement</span><b>14:30</b><span>Point équipe</span></div>
      </div>
      <div class="card" id="sug"></div>
    </section>
    
  </div>
  <div class="ind" id="ind"></div>
  <div class="search" id="sr">Rechercher une appli ou une action</div>
  <div class="dock" id="dk"></div>

  <div class="sheet" id="dr">
    <input id="q" placeholder="Rechercher une appli" aria-label="Rechercher une appli" autocomplete="off">
    <div class="drawer"><div class="grid" id="g2"></div></div>
    <button class="pill" id="cl1">Fermer</button>
  </div>

  <div class="shade" id="sh">
    <div class="tg" id="tg"></div>
    <div class="card"><div style="font-size:13px;color:var(--tx2);margin-bottom:6px">Luminosité</div><input type="range" id="br" min="30" max="100" value="100" aria-label="Luminosité"></div>
    <div class="card opts" id="opts">
      <span>Accent</span>
      <span class="sw on" style="background:#4f7cff" data-c="#4f7cff"></span>
      <span class="sw" style="background:#ff5c8a" data-c="#ff5c8a"></span>
      <span class="sw" style="background:#12b886" data-c="#12b886"></span>
      <span class="sw" style="background:#ff9f1c" data-c="#ff9f1c"></span>
      <button class="pill" id="th">Thème</button>
      <button class="pill" id="sq">Forme des icônes</button>
    </div>
    <div class="card" style="font-size:14px"><b>Astuce</b><br><span style="color:var(--tx2)">Appui long sur l’écran d’accueil pour réorganiser. Glisse vers le haut pour le tiroir d’applis.</span></div>
    <button class="pill" id="cl2" style="margin-top:auto">Fermer</button>
  </div>
  <div class="toast" id="ts"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const apps=[["Téléphone","📞","#34c759"],["Messages","💬","#4f7cff"],["Appareil photo","📷","#5b6070"],["Galerie","🖼️","#ff5c8a"],["Navigateur","🌐","#7c5cff"],["Musique","🎵","#ff3b6b"],["Agenda","📅","#ff9f1c"],["Horloge","⏰","#12b886"],["Notes","📝","#f5b700"],["Météo","⛅","#3aa6ff"],["Cartes","🗺️","#2fb36d"],["Réglages","⚙️","#6b7280"],["Santé","❤️","#ff4d4d"],["Fichiers","📁","#e0a100"],["Calculatrice","🧮","#444b5c"],["Boutique","🛍️","#9b5cff"],["Vidéos","▶️","#ff3d3d"],["Mail","✉️","#2b7de9"],["Portefeuille","💳","#0f9d8a"],["Dictaphone","🎙️","#d6336c"]];
const isN=typeof Android!=="undefined";if(isN)document.body.classList.add("native");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let list=apps.map(a=>({n:a[0],e:a[1],c:a[2],p:""}));
if(isN){try{list=JSON.parse(Android.getApps()).map(a=>({n:a.n,p:a.p,i:"data:image/png;base64,"+a.i}))}catch(e){}}
const mk=a=>`<div class="app" tabindex="0" role="button" data-n="${esc(a.n)}" data-p="${a.p||""}"><div class="ic"${a.i?"":` style="background:linear-gradient(145deg,${a.c},${a.c}cc)"`}>${a.i?`<img src="${a.i}" alt="">`:a.e}</div><span>${esc(a.n)}</span></div>`;
const keys=["dial","phone","mms","messag","camera","chrome","browser"];let dk=[];
keys.forEach(k=>{const a=list.find(x=>(x.p||x.n).toLowerCase().includes(k));if(a&&!dk.includes(a))dk.push(a)});
list.forEach(a=>{if(dk.length<4&&!dk.includes(a))dk.push(a)});dk=dk.slice(0,4);
$("#dk").innerHTML=dk.map(a=>mk(a).replace(/<span>.*?<\/span>/,"")).join("");
const per=20,home=list.filter(a=>!dk.includes(a));
for(let i=0;i<home.length;i+=per){const s=document.createElement("section");s.className="page";s.innerHTML=`<div class="grid">${home.slice(i,i+per).map(mk).join("")}</div>`;$("#pages").appendChild(s)}
$("#ind").innerHTML=Array.from({length:$("#pages").children.length},(_,i)=>`<u${i?"":' class="on"'}></u>`).join("");
$("#g2").innerHTML=[...list].sort((a,b)=>a.n.localeCompare(b.n,"fr")).map(mk).join("");
let L={};try{L=JSON.parse(localStorage.getItem("aura")||"{}")}catch(e){}
const sug=()=>{const t=Object.entries(L).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>list.find(a=>a.n===e[0])).filter(Boolean);$("#sug").innerHTML=t.length?`<div style="font-size:13px;color:var(--tx2);margin-bottom:10px">Utilisées souvent</div><div class="sug">${t.map(mk).join("")}</div>`:`<div style="font-size:13px;color:var(--tx2)">Tes applis les plus utilisées apparaîtront ici.</div>`};sug();
const ph=$("#ph"),toast=m=>{const t=$("#ts");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1100)};
const go=a=>{if(!a||ph.classList.contains("edit"))return;const n=a.dataset.n;L[n]=(L[n]||0)+1;try{localStorage.setItem("aura",JSON.stringify(L))}catch(e){}sug();dr.classList.remove("open");if(isN&&a.dataset.p)Android.launch(a.dataset.p);else toast("Ouverture : "+n)};
ph.addEventListener("click",e=>go(e.target.closest(".app")));
ph.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("app"))go(e.target)});
function closeSheets(){dr.classList.remove("open");sh.classList.remove("open");ph.classList.remove("edit");pg.scrollTo({left:0,behavior:"smooth"})}
// horloge
const tick=()=>{const d=new Date(),h=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});$("#clk").textContent=h;$("#sbt").textContent=h;$("#dt").textContent=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})};tick();setInterval(tick,10000);
// batterie
if(isN){const ub=()=>{$("#bat").textContent=Android.getBattery()+" %"};ub();setInterval(ub,60000)}else if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>$("#bat").textContent=Math.round(b.level*100)+" %";u();b.onlevelchange=u}).catch(()=>{});
// pile intelligente
const cards=[["Météo","22°","Paris, ciel dégagé. Pluie prévue vers 18 h."],["Musique","Lecture","Morceau suivant dans ta playlist du matin."],["Batterie","Prête","Charge complète estimée dans 40 min."]];let ci=0;
const rs=()=>{$("#stack").innerHTML=`<div><p>${cards[ci][0]}</p><h3>${cards[ci][1]}</h3><p>${cards[ci][2]}</p></div><div class="dots">${cards.map((_,i)=>`<u class="${i==ci?"on":""}"></u>`).join("")}</div>`};rs();
$("#stack").onclick=()=>{ci=(ci+1)%cards.length;rs()};
// pages
const pg=$("#pages");pg.addEventListener("scroll",()=>{const i=Math.round(pg.scrollLeft/pg.clientWidth);document.querySelectorAll("#ind u").forEach((u,k)=>u.classList.toggle("on",k==i))});
// tiroir
const dr=$("#dr"),sh=$("#sh");
const od=()=>{dr.classList.add("open");$("#q").value="";f("")};
$("#sr").onclick=od;$("#cl1").onclick=()=>dr.classList.remove("open");
const f=v=>document.querySelectorAll("#g2 .app").forEach(a=>a.style.display=a.dataset.n.toLowerCase().includes(v.toLowerCase())?"":"none");
$("#q").oninput=e=>f(e.target.value);
// gestes verticaux
let y0=null;ph.addEventListener("pointerdown",e=>{y0=e.clientY});
ph.addEventListener("pointerup",e=>{if(y0===null)return;const d=e.clientY-y0;y0=null;if(dr.classList.contains("open")||sh.classList.contains("open"))return;if(d<-80)od();if(d>80)sh.classList.add("open")});
$("#hd").onclick=()=>sh.classList.add("open");$("#cl2").onclick=()=>sh.classList.remove("open");
// bascules
$("#tg").innerHTML=[["📶",1],["🔵",1],["✈️",0],["🔦",0],["🌙",0],["🔕",0],["📍",1],["🔋",0]].map(t=>`<button class="${t[1]?"on":""}" aria-pressed="${!!t[1]}">${t[0]}</button>`).join("");
$("#tg").onclick=e=>{const b=e.target.closest("button");if(!b)return;b.classList.toggle("on");b.setAttribute("aria-pressed",b.classList.contains("on"))};
$("#br").oninput=e=>ph.style.filter=`brightness(${.4+e.target.value/100*.6})`;
// personnalisation
const R=document.documentElement;
$("#opts").onclick=e=>{const s=e.target.closest(".sw");if(!s)return;document.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));s.classList.add("on");R.style.setProperty("--ac",s.dataset.c)};
let th=0;$("#th").onclick=()=>{th=(th+1)%2;R.dataset.theme=th?"dark":"light"};
const shapes=["26%","50%","12%"];let si=0;$("#sq").onclick=()=>{si=(si+1)%3;R.style.setProperty("--r",shapes[si])};
// mode édition
let lp;ph.addEventListener("pointerdown",e=>{if(e.target.closest(".sheet,.shade,.dock,.search"))return;lp=setTimeout(()=>{ph.classList.toggle("edit");toast(ph.classList.contains("edit")?"Mode édition : appuie longuement pour quitter":"Modifications enregistrées")},650)});
["pointerup","pointermove","pointerleave"].forEach(ev=>ph.addEventListener(ev,()=>clearTimeout(lp)));
</script>
</body>
</html>
